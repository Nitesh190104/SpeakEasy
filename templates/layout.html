<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SpeakEasy{% endblock %} - AI Language Practice</title>
    <meta name="description" content="Practice speaking foreign languages with AI-powered feedback. Get real-time analysis on grammar, pronunciation, fluency, and vocabulary.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }

        body {
            background: #0a0a1a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* Animated gradient background */
        .bg-animated {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(168, 85, 247, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 50% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
            animation: bgShift 15s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        /* Glass card style */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }

        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #818cf8, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Glow button */
        .btn-glow {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            border: none;
            cursor: pointer;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.5);
        }

        .btn-glow:active {
            transform: translateY(0);
        }

        /* Nav link */
        .nav-link {
            position: relative;
            padding: 8px 16px;
            border-radius: 10px;
            transition: all 0.3s ease;
            color: #94a3b8;
            font-weight: 500;
            text-decoration: none;
        }

        .nav-link:hover, .nav-link.active {
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.06);
        }

        .nav-link.active {
            color: #a78bfa;
        }

        /* Score ring */
        .score-ring {
            width: 80px;
            height: 80px;
        }

        .score-ring circle {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
        }

        .score-ring .bg-ring {
            stroke: rgba(255, 255, 255, 0.06);
        }

        .score-ring .fg-ring {
            stroke: url(#scoreGradient);
            transition: stroke-dashoffset 1s ease;
        }

        /* Pulse animation */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); }
            50% { box-shadow: 0 0 40px rgba(99, 102, 241, 0.6); }
        }

        .pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }

        /* Floating particles */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: rgba(168, 85, 247, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.3); border-radius: 3px; }

        /* Micro animation for cards */
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-4px);
            border-color: rgba(168, 85, 247, 0.3);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.15);
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 16px 24px;
            border-radius: 12px;
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .toast-info {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
        }

        /* Mobile nav toggle */
        .mobile-nav {
            display: none;
        }

        @media (max-width: 768px) {
            .desktop-nav { display: none; }
            .mobile-nav { display: block; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Animated background -->
    <div class="bg-animated"></div>

    <!-- Floating particles -->
    <div id="particles"></div>

    <!-- Navigation -->
    <nav class="relative z-50 px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-xl shadow-lg shadow-indigo-500/20 group-hover:shadow-indigo-500/40 transition-shadow">
                    🗣️
                </div>
                <span class="text-xl font-bold gradient-text">SpeakEasy</span>
            </a>

            <!-- Desktop nav -->
            <div class="desktop-nav flex items-center gap-2">
                <a href="/" class="nav-link" id="nav-home">Home</a>
                <a href="/practice" class="nav-link" id="nav-practice">Practice</a>
                <a href="/vocabulary" class="nav-link" id="nav-vocabulary">Vocabulary</a>
                <a href="/progress" class="nav-link" id="nav-progress">Progress</a>
            </div>

            <!-- Mobile nav button -->
            <button class="mobile-nav text-white p-2" onclick="toggleMobileMenu()" id="mobile-menu-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12h18M3 6h18M3 18h18"/>
                </svg>
            </button>
        </div>

        <!-- Mobile menu -->
        <div id="mobile-menu" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 md:hidden">
            <div class="glass-strong m-4 p-6 rounded-2xl">
                <div class="flex justify-end mb-6">
                    <button onclick="toggleMobileMenu()" class="text-white p-2">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6L6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <div class="flex flex-col gap-3">
                    <a href="/" class="nav-link text-lg">🏠 Home</a>
                    <a href="/practice" class="nav-link text-lg">🎯 Practice</a>
                    <a href="/vocabulary" class="nav-link text-lg">📚 Vocabulary</a>
                    <a href="/progress" class="nav-link text-lg">📊 Progress</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="relative z-10 px-4 pb-12">
        {% block content %}{% endblock %}
    </main>

    <!-- SVG Defs for score rings -->
    <svg class="hidden">
        <defs>
            <linearGradient id="scoreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#818cf8"/>
                <stop offset="100%" stop-color="#c084fc"/>
            </linearGradient>
        </defs>
    </svg>

    <!-- Toast container -->
    <div id="toast" class="toast"></div>

    <script>
        // Generate floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (8 + Math.random() * 12) + 's';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.width = (2 + Math.random() * 3) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }
        createParticles();

        // Active nav highlighting
        const path = window.location.pathname;
        document.querySelectorAll('.nav-link').forEach(link => {
            if (link.getAttribute('href') === path || 
                (path.startsWith('/practice') && link.getAttribute('href') === '/practice') ||
                (path.startsWith('/vocabulary') && link.getAttribute('href') === '/vocabulary') ||
                (path.startsWith('/progress') && link.getAttribute('href') === '/progress')) {
                link.classList.add('active');
            }
        });

        // Mobile menu toggle
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        // Toast notification
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
